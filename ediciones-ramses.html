<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ediciones Ramsés | SaShii</title>
    <meta name="description" content="Ediciones Ramsés, un proyecto de diseño para redes sociales de SaShii." />
    <link rel="icon" type="image/webp" href="/art/sashi-logo.webp" />
    <link rel="preload" href="/fonts/Anton-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/ediciones-ramses.css" />
  </head>
  <body id="top" class="ramses-page">
    <div id="project-header" data-project="ediciones-ramses"><!--project-header--></div>

    <main class="ramses-main">
      <section class="ramses-hero" aria-labelledby="ramses-title">
        <div class="ramses-wordmark">
          <h1 id="ramses-title">Ediciones Ramsés</h1>
          <span aria-hidden="true">Ediciones Ramsés</span>
        </div>

        <div class="ramses-caption">
          <p lang="en"><strong>Postfolio:</strong> Social Media Design</p>
          <svg class="ramses-magnifier" viewBox="0 0 68 68" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
            <circle cx="27.5" cy="27.5" r="24.5" />
            <path d="m46 46 17 17" />
          </svg>
          <img class="ramses-cursor" src="/art/ramses-cursor.webp" alt="" width="85" height="149" />
        </div>
      </section>

      <section class="ramses-palette" aria-label="Paleta de colores">
        <span class="ramses-swatch ramses-swatch-red" role="img" aria-label="Rojo #9f1916"></span>
        <span class="ramses-swatch ramses-swatch-gray" role="img" aria-label="Gris #858485"></span>
      </section>
    </main>

    <div id="project-footer"><!--project-footer--></div>
    <script type="module" src="/src/project-page.tsx"></script>
  </body>
</html>
