<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hospital Católico Universitario | SaShii</title>
    <meta name="description" content="Proyecto de identidad de marca y diseño para redes sociales del Hospital Católico Universitario Nuestra Señora de Suyapa, por SaShii." />
    <link rel="icon" type="image/webp" href="/art/sashi-logo.webp" />
    <link rel="stylesheet" href="/src/hospital-catolico.css" />
  </head>
  <body id="top" class="hospital-page">
    <div id="project-header" data-project="hospital-catolico"><!--project-header--></div>

    <main class="hospital-main">
      <section class="hospital-hero" aria-labelledby="hospital-title">
        <div class="hospital-palette" aria-hidden="true"></div>
        <div class="hospital-stage">
          <svg class="hospital-watermark" viewBox="0 0 155 465" aria-hidden="true">
            <path d="M160 -5C87 8 51 101 89 166 43 206 13 248 23 325 31 399 67 453 162 475" />
          </svg>

          <h1 id="hospital-title" aria-label="Hospital Católico Universitario Nuestra Señora de Suyapa"><strong>HCU</strong>NSS</h1>

          <div class="hospital-collage">
            <div class="hospital-building">
              <img src="/art/hospital/fachada.webp" alt="Fachada del Hospital Católico Universitario Nuestra Señora de Suyapa" width="1599" height="1066" fetchpriority="high" />
            </div>

            <svg class="hospital-portrait-definitions" width="0" height="0" aria-hidden="true">
              <defs>
                <clipPath id="hospital-portrait-outline" clipPathUnits="objectBoundingBox">
                  <path d="M.32 .09Q.5 -.09 .68 .09L.91 .32Q1.09 .5 .91 .68L.68 .91Q.5 1.09 .32 .91L.09 .68Q-.09 .5 .09 .32Z" />
                </clipPath>
              </defs>
            </svg>

            <div class="hospital-portrait hospital-portrait-lab">
              <img src="/art/hospital/laboratorio.webp" alt="Profesional del hospital en el laboratorio" width="533" height="800" />
            </div>
            <div class="hospital-portrait hospital-portrait-doctor">
              <img src="/art/hospital/medico.webp" alt="Médico en su consultorio" width="800" height="533" />
            </div>
            <div class="hospital-portrait hospital-portrait-staff">
              <img src="/art/hospital/doctora.webp" alt="Doctora con bata del hospital" width="800" height="533" />
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="project-footer"><!--project-footer--></div>
    <script type="module" src="/src/project-page.tsx"></script>
  </body>
</html>
